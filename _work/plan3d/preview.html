<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nest Battersea | 3D floor plan preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#92b7ca;--ink:#161922;--panel:rgba(22,25,34,.82)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#101218;color:#fff;font-family:Poppins,system-ui,sans-serif}
#stage{position:fixed;inset:10px;border-radius:28px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#1d2230,#0e1016)}
#v{position:absolute;inset:0}
.p3-labels{position:absolute;inset:0;pointer-events:none}
.p3-hot{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;color:#fff}
.p3-hot i{display:block;width:12px;height:12px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px rgba(146,183,202,.25);margin:-6px 0 0 -6px;animation:pulse 2.4s infinite}
.p3-hot span{position:absolute;left:14px;top:-14px;white-space:nowrap;background:var(--ink);font:600 11px/1 Poppins;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;border-radius:999px;opacity:0;transform:translateX(-4px);transition:.25s}
.p3-hot.on span,.p3-hot:hover span{opacity:1;transform:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(146,183,202,.45)}70%{box-shadow:0 0 0 12px rgba(146,183,202,0)}100%{box-shadow:0 0 0 0 rgba(146,183,202,0)}}
#side{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:270px;background:var(--panel);backdrop-filter:blur(14px);border-radius:22px;padding:22px;border:1px solid rgba(255,255,255,.08)}
#side h1{font-weight:500;font-size:26px;margin:0 0 4px}
#side p{margin:0 0 14px;color:#b9c2cc;font-size:12px;line-height:1.5}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:999px;padding:4px;margin:0 0 14px}
.seg button{flex:1;border:0;background:none;color:#cfd6dd;font:500 12px Poppins;padding:9px 6px;border-radius:999px;cursor:pointer;transition:.25s}
.seg button.on{background:#fff;color:var(--ink)}
#rooms{list-style:none;margin:0;padding:0}
#rooms li button{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;color:#fff;font:400 13px Poppins;padding:10px 2px;border-top:1px solid rgba(255,255,255,.08);cursor:pointer}
#rooms li button:hover{color:var(--blue)}
#photo{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .6s ease}
#photo.on{opacity:1;pointer-events:auto}
#photo img{width:100%;height:100%;object-fit:cover}
#photo .cap{position:absolute;left:28px;bottom:26px;background:var(--panel);backdrop-filter:blur(12px);padding:10px 16px;border-radius:999px;font-size:13px}
#photo .back{position:absolute;right:28px;bottom:26px;border:0;background:#fff;color:var(--ink);font:500 13px Poppins;padding:11px 18px;border-radius:999px;cursor:pointer}
#home{position:absolute;left:28px;top:24px;display:flex;gap:8px}
#home button{border:0;background:var(--panel);color:#fff;font:500 12px Poppins;padding:10px 16px;border-radius:999px;cursor:pointer}
#home button.on{background:#fff;color:var(--ink)}
@media (max-width:760px){#side{left:16px;right:16px;top:auto;bottom:16px;transform:none;width:auto}}
</style>
</head>
<body>
<div id="stage">
  <div id="v"></div>
  <div id="home"><button data-apt="loft4" class="on">LOFT 4</button><button data-apt="bung3">Bungalow 3</button></div>
  <aside id="side">
    <h1 id="name">LOFT 4</h1>
    <p id="spec"></p>
    <div class="seg" id="levels"></div>
    <ul id="rooms"></ul>
  </aside>
  <div id="photo"><img alt=""><span class="cap"></span><button class="back" type="button">Back to the plan</button></div>
</div>
<script type="module">
import { createViewer, APARTMENTS } from '../../assets/js/plan3d.js';
const SPEC = { loft4: '4 bedrooms | 7 people | 134 m² inside | 12 m² garden | two levels', bung3: '2 bedrooms | 3 people | 65 m² inside | 15 m² garden | one level' };
const $ = (s) => document.querySelector(s);
let apt = 'loft4';
const v = createViewer($('#v'), { apt, onRoom: open });
window.viewer = v;
function ui() {
  $('#name').textContent = APARTMENTS[apt].name;
  $('#spec').textContent = SPEC[apt];
  const lv = $('#levels');
  lv.innerHTML = '';
  lv.style.display = v.levels.length > 1 ? '' : 'none';
  v.levels.forEach((l, i) => {
    const b = document.createElement('button');
    b.textContent = l.label;
    b.className = i === v.level ? 'on' : '';
    b.onclick = async () => { [...lv.children].forEach((c, k) => c.classList.toggle('on', k === i)); await v.setLevel(i); list(); };
    lv.appendChild(b);
  });
  list();
}
function list() {
  const ul = $('#rooms');
  ul.innerHTML = '';
  APARTMENTS[apt].levels.forEach((l, i) => {
    if (v.levels.length > 1 && i !== v.level) return;
    l.rooms.filter((r) => r.photo).forEach((r) => {
      const li = document.createElement('li');
      li.innerHTML = `<button type="button"><span>${r.name}</span><span>›</span></button>`;
      li.firstChild.onclick = () => open(r);
      ul.appendChild(li);
    });
  });
}
async function open(r) {
  const img = $('#photo img');
  const src = `../../assets/interiors/${r.photo}.jpg`;
  const ok = await fetch(src, { method: 'HEAD' }).then((x) => x.ok).catch(() => false);
  await v.dive(r.photo);
  if (!ok) { setTimeout(() => v.frame(true), 900); return; }
  img.src = src;
  $('#photo .cap').textContent = r.name;
  $('#photo').classList.add('on');
}
$('#photo .back').onclick = () => { $('#photo').classList.remove('on'); v.frame(true); };
document.querySelectorAll('#home button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('#home button').forEach((x) => x.classList.toggle('on', x === b));
  apt = b.dataset.apt;
  v.load(apt);
  ui();
});
ui();
</script>
</body>
</html>
